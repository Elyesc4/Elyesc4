<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elyes Brinis</title>
  <meta name="description" content="Elyes Brinis – Software Developer. Website coming soon.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111'/><text x='50' y='68' font-size='56' font-family='monospace' font-weight='700' text-anchor='middle' fill='%237CFFB2'>E</text></svg>">
  <style>
    :root {
      --bg: #0d0f12;
      --fg: #e8eaed;
      --muted: #8a919c;
      --accent: #7cffb2;
      --line: #1f242b;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f7f9; --fg: #14171a; --muted: #5d6470; --accent: #0a8f4e; --line: #e1e4e8; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px;
      background-position: center;
    }
    main {
      max-width: 34rem;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 2.5rem 2rem;
    }
    .prompt {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .prompt span { color: var(--accent); }
    .cursor {
      display: inline-block;
      width: .55em; height: 1.05em;
      background: var(--accent);
      vertical-align: -.15em;
      margin-left: .15em;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    h1 {
      font-size: clamp(2rem, 6vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: -.02em;
      margin-bottom: .5rem;
    }
    .role { color: var(--muted); font-size: 1.05rem; margin-bottom: 2rem; }
    p.note { line-height: 1.6; margin-bottom: 2rem; }
    a.contact {
      display: inline-block;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: .95rem;
      color: var(--bg);
      background: var(--accent);
      text-decoration: none;
      padding: .7rem 1.1rem;
      border-radius: 8px;
      transition: transform .15s ease;
    }
    a.contact:hover { transform: translateY(-2px); }
    a.contact:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      font-size: .8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="prompt"><span>~/brinis.de</span> $ deploy --soon<span class="cursor" aria-hidden="true"></span></div>
    <h1>Elyes Brinis</h1>
    <div class="role">Software Developer · Velbert, NRW</div>
    <p class="note">Hier entsteht gerade meine Website. Bis dahin erreichst du mich per E-Mail.</p>
    <a class="contact" href="mailto:briniselyes@gmail.com">briniselyes@gmail.com</a>
    <footer>&copy; <span id="y">2026</span> Elyes Brinis</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
